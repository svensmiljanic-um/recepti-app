# ime aplikacije
spring.application.name=backend

# povezava s podatkovno bazo PostgreSQL
# vrednosti se preberejo iz okoljskih spremenljivk (za DB_URL in DB_USERNAME je privzeta vrednost za lokalni razvoj)
# DB_PASSWORD nima privzete vrednosti, zato jo je treba nastaviti (gesla ne shranjujemo v repozitorij)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recepti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ss}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: ob zagonu Spring sam ustvari ali dopolni tabelo glede na entiteto (stolpcev ne brise)
spring.jpa.hibernate.ddl-auto=update

# jezik SQL-a za PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# v konzoli izpise SQL poizvedbe
spring.jpa.show-sql=true